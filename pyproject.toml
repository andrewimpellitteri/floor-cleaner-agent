[project]
name = "floorclean"
version = "0.1.0"
description = "Physics-based simulation and RL optimisation of pressure-washing a sloped bay floor"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.4.35",
    "flax>=0.10.0",
    "optax>=0.2.4",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "imageio[ffmpeg]>=2.36",
    "tyro>=0.9",
    "orbax-checkpoint>=0.10",
    "pandas>=2.2",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.4.35"]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["floorclean"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
